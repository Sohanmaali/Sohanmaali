<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img" aria-label="Dev quote: Talk is cheap. Show me the code. — Linus Torvalds">
<title>Dev quote: Talk is cheap. Show me the code. — Linus Torvalds</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.f{animation:f .45s ease-out both}
.on{animation:on .01s steps(1) both}
.px{animation:px .5s ease-out both}
.cur{animation:blink 1s steps(1) infinite}
.tw{animation:tw 3.2s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.wide{transform-box:fill-box;transform-origin:left;animation:wide .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes px{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes tw{50%{opacity:.15}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wide{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="839" height="179" rx="12" fill="#0b0d17" stroke="#262a3d"/><path d="M1 40V12.5A11.5 11.5 0 0 1 12.5 1H827.5A11.5 11.5 0 0 1 839 12.5V40Z" fill="#151827"/><line x1="1" x2="839" y1="40.5" y2="40.5" stroke="#262a3d"/><circle cx="24" cy="20.5" r="6" fill="#ff6ac1"/><circle cx="44" cy="20.5" r="6" fill="#f3f99d"/><circle cx="64" cy="20.5" r="6" fill="#5af78e"/><text x="420" y="25.5" font-size="14" fill="#7c849b" textLength="92.4" lengthAdjust="spacing" text-anchor="middle">~/dev-quote</text><text x="30" y="74" font-size="15" fill="#5af78e" textLength="108.0" lengthAdjust="spacing" font-weight="700">sohan@github</text><text x="138.0" y="74" font-size="15" fill="#7c849b" textLength="27.0" lengthAdjust="spacing">:~$</text><text class="on" x="174.0" y="74" font-size="15" font-weight="600" fill="#d8dee9" style="animation-delay:0.40s">f</text><text class="on" x="183.0" y="74" font-size="15" font-weight="600" fill="#d8dee9" style="animation-delay:0.46s">o</text><text class="on" x="192.0" y="74" font-size="15" font-weight="600" fill="#d8dee9" style="animation-delay:0.52s">r</text><text class="on" x="201.0" y="74" font-size="15" font-weight="600" fill="#d8dee9" style="animation-delay:0.58s">t</text><text class="on" x="210.0" y="74" font-size="15" font-weight="600" fill="#d8dee9" style="animation-delay:0.64s">u</text><text class="on" x="219.0" y="74" font-size="15" font-weight="600" fill="#d8dee9" style="animation-delay:0.70s">n</text><text class="on" x="228.0" y="74" font-size="15" font-weight="600" fill="#d8dee9" style="animation-delay:0.76s">e</text><g class="f" style="animation-delay:1.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="346.8" lengthAdjust="spacing" font-weight="600">“Talk is cheap. Show me the code.”</text><text x="810" y="154" font-size="14" fill="#7c849b" textLength="134.4" lengthAdjust="spacing" text-anchor="end">— Linus Torvalds</text></g>
</svg>
