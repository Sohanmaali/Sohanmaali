<svg xmlns="http://www.w3.org/2000/svg" width="840" height="212" viewBox="0 0 840 212" role="img" aria-label="Dev quotes: Debugging is twice as hard as writing the code in the first place. — Brian Kernighan / Talk is cheap. Show me the code. — Linus Torvalds / Premature optimization is the root of all evil. — Donald Knuth / Simplicity is prerequisite for reliability. — Edsger W. Dijkstra / Programs must be written for people to read, and only incidentally for machines to execute. — Harold Abelson / Any fool can write code that a computer can understand. Good programmers write code that humans can understand. — Martin Fowler / Make it work, make it right, make it fast. — Kent Beck / Controlling complexity is the essence of computer programming. — Brian Kernighan / The best way to predict the future is to invent it. — Alan Kay / Code is like humor. When you have to explain it, it's bad. — Cory House / Truth can only be found in one place: the code. — Robert C. Martin / Walking on water and developing software from a specification are easy if both are frozen. — Edward V. Berard">
<title>Dev quotes: Debugging is twice as hard as writing the code in the first place. — Brian Kernighan / Talk is cheap. Show me the code. — Linus Torvalds / Premature optimization is the root of all evil. — Donald Knuth / Simplicity is prerequisite for reliability. — Edsger W. Dijkstra / Programs must be written for people to read, and only incidentally for machines to execute. — Harold Abelson / Any fool can write code that a computer can understand. Good programmers write code that humans can understand. — Martin Fowler / Make it work, make it right, make it fast. — Kent Beck / Controlling complexity is the essence of computer programming. — Brian Kernighan / The best way to predict the future is to invent it. — Alan Kay / Code is like humor. When you have to explain it, it's bad. — Cory House / Truth can only be found in one place: the code. — Robert C. Martin / Walking on water and developing software from a specification are easy if both are frozen. — Edward V. Berard</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.f{animation:f .45s ease-out both}
.on{animation:on .01s steps(1) both}
.px{animation:px .5s ease-out both}
.cur{animation:blink 1s steps(1) infinite}
.tw{animation:tw 3.2s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.wide{transform-box:fill-box;transform-origin:left;animation:wide .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes px{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes tw{50%{opacity:.15}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wide{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
