ing" font-weight="600">“Debugging is twice as hard as writing the code in the first place.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="142.8" lengthAdjust="spacing" text-anchor="end">— Brian Kernighan</text></g><g class="q q1" style="animation-delay:9.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="346.8" lengthAdjust="spacing" font-weight="600">“Talk is cheap. Show me the code.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="134.4" lengthAdjust="spacing" text-anchor="end">— Linus Torvalds</text></g><g class="q q2" style="animation-delay:17.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="499.8" lengthAdjust="spacing" font-weight="600">“Premature optimization is the root of all evil.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="117.6" lengthAdjust="spacing" text-anchor="end">— Donald Knuth</text></g><g class="q q3" style="animation-delay:25.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="459.0" lengthAdjust="spacing" font-weight="600">“Simplicity is prerequisite for reliability.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="168.0" lengthAdjust="spacing" text-anchor="end">— Edsger W. Dijkstra</text></g><g class="q q4" style="animation-delay:33.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="724.2" lengthAdjust="spacing" font-weight="600">“Programs must be written for people to read, and only incidentally for</text><text x="30" y="150" font-size="17" fill="#f3f99d" textLength="214.2" lengthAdjust="spacing" font-weight="600">machines to execute.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="134.4" lengthAdjust="spacing" text-anchor="end">— Harold Abelson</text></g><g class="q q5" style="animation-delay:41.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="744.6" lengthAdjust="spacing" font-weight="600">“Any fool can write code that a computer can understand. Good programmers</text><text x="30" y="150" font-size="17" fill="#f3f99d" textLength="397.8" lengthAdjust="spacing" font-weight="600">write code that humans can understand.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="126.0" lengthAdjust="spacing" text-anchor="end">— Martin Fowler</text></g><g class="q q6" style="animation-delay:49.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="448.8" lengthAdjust="spacing" font-weight="600">“Make it work, make it right, make it fast.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="92.4" lengthAdjust="spacing" text-anchor="end">— Kent Beck</text></g><g class="q q7" style="animation-delay:57.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="652.8" lengthAdjust="spacing" font-weight="600">“Controlling complexity is the essence of computer programming.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="142.8" lengthAdjust="spacing" text-anchor="end">— Brian Kernighan</text></g><g class="q q8" style="animation-delay:65.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="540.6" lengthAdjust="spacing" font-weight="600">“The best way to predict the future is to invent it.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="84.0" lengthAdjust="spacing" text-anchor="end">— Alan Kay</text></g><g class="q q9" style="animation-delay:73.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="612.0" lengthAdjust="spacing" font-weight="600">“Code is like humor. When you have to explain it, it's bad.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="100.8" lengthAdjust="spacing" text-anchor="end">— Cory House</text></g><g class="q q10" style="animation-delay:81.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="499.8" lengthAdjust="spacing" font-weight="600">“Truth can only be found in one place: the code.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="151.2" lengthAdjust="spacing" text-anchor="end">— Robert C. Martin</text></g><g class="q q11" style="animation-delay:89.07s"><text x="30" y="122" font-size="17" fill="#f3f99d" textLength="754.8" lengthAdjust="spacing" font-weight="600">“Walking on water and developing software from a specification are easy if</text><text x="30" y="150" font-size="17" fill="#f3f99d" textLength="173.4" lengthAdjust="spacing" font-weight="600">both are frozen.”</text><text x="810" y="184" font-size="14" fill="#7c849b" textLength="151.2" lengthAdjust="spacing" text-anchor="end">— Edward V. Berard</text></g>
