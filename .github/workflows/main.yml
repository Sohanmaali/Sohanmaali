name: Update profile README

on:
  schedule:
    - cron: '17 3 * * *' # daily
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['scripts/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate SVGs with live stats
        run: node scripts/build-readme.mjs
        env:
          # Optional: add a PROFILE_TOKEN secret (personal access token) to count private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
